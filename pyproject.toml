# GPL-3.0-or-later - see LICENSE
[build-system]
requires = ["setuptools>=77", "setuptools-scm>=8", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flowstate"
dynamic = ["version"]
description = "Lightweight utility for computing flow states"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [
    {name = "Christoph Hader", email = "christoph.hader@gmail.com"},
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Physics",
]
keywords = ["compressible-flow", "aerodynamics", "gas-dynamics", "cfd"]

dependencies = [
    "h5py>=3.10.0",
    "typer>=0.9.0",
    "tomli-w>=1.0.0",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.1.0",
    "zensical",
    "mkdocstrings[python]>=0.24",
]

[project.scripts]
flow-state = "flow_state.cli.app:app"

[project.urls]
Homepage = "https://github.com/uahypersonics/flow-state"
Repository = "https://github.com/uahypersonics/flow-state"
Documentation = "https://uahypersonics.github.io/flow-state"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"flow_state" = ["examples/*/*"]

[tool.setuptools_scm]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = ["E501"]
